name: Plate verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/verify-physics.cjs
      - run: node tools/verify-field.cjs
      - run: node tools/verify-signal.cjs
      - run: node tools/verify-circle-model.cjs
      - run: npm install --no-save playwright@1.61.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 > /tmp/cymantix-server.log 2>&1 &
          node tools/verify-web.cjs
          node tools/verify-circle.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cymantix-browser-preview
          path: /tmp/cymantix-refined-original.png
